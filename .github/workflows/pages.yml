name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund

      - run: npx vite build --config vite.pages.config.ts
      - name: Collect static site
        run: |
          mkdir -p _site
          if [ ! -d dist-pages ]; then
            echo "dist-pages missing" >&2
            exit 1
          fi
          cp -a dist-pages/. _site/
          if [ -f _site/index.pages.html ] && [ ! -f _site/index.html ]; then
            mv _site/index.pages.html _site/index.html
          fi
          test -f _site/index.html
          cp _site/index.html _site/404.html
          find _site -maxdepth 3 | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
